name: PR Tests
run-name: PR Tests for modules by ${{ github.actor }}

on:
  pull_request:
    branches:
      - 'main'
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Mirrors the spektr / konstellation-meta-dsl PR pattern. Three quirks specific
# to ino:
#   1. Multi-module Gradle root — we target :ino-core explicitly for tests
#      and coverage. :ino-dsl is konstellation-generated; :ino-test is fixtures.
#   2. No detekt-check job yet — Detekt 1.23.x is incompatible with the Kotlin
#      2.3.x that ino-core uses, and Detekt 2.x isn't released. Re-add when
#      Detekt 2.0 ships.
#   3. Extra dashboard-checks job for the SvelteKit UI in ino-dashboard.

jobs:
  # --- Backend (Gradle) ---
  build-check:
    uses: khorum-oss/public-cicd/.github/workflows/gradle-build.yml@main
    with:
      java-version: '21'
      build-tasks: 'classes testClasses'

  test-core:
    needs: build-check
    uses: khorum-oss/public-cicd/.github/workflows/gradle-unit-tests.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      java-version: '21'
      module: ':ino-core'
      module-path: 'ino-core'
      artifact-suffix: 'ino-core'
      coverage-enabled: true
      min-coverage-overall: 60

  # --- Frontend (SvelteKit / npm) ---
  dashboard-checks:
    name: Dashboard Lint / Build / Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ino-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ino-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-kit sync + svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build static bundle
        env:
          DASHBOARD_BASE: /dashboard
        run: npm run build

  # --- Coverage + SonarCloud ---
  # Kover XML is generated by test-core; we re-run koverXmlReport here so the
  # report is in the workspace for Codecov + Sonar. Sonar is skipped if its
  # token isn't configured.
  coverage-and-sonar:
    name: Coverage Upload & SonarCloud
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud requires full history for blame/new-code detection
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Kover XML report
        run: ./gradlew :ino-core:koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ino-core/build/reports/kover/report.xml
          fail_ci_if_error: false
          verbose: true

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

  # --- Notification ---
  notify-discord:
    name: Notify Discord
    needs:
      - build-check
      - test-core
      - dashboard-checks
      - coverage-and-sonar
    if: always()
    uses: khorum-oss/public-cicd/.github/workflows/notify-discord.yml@main
    with:
      runs-on: ubuntu-latest
      workflow_name: ${{ github.workflow }}
      build_result: ${{ needs.build-check.result }}
      test_result: ${{ (needs.test-core.result == 'success' && needs.dashboard-checks.result == 'success') && 'success' || 'failure' }}
      detekt_result: 'skipped'
      pr_title: ${{ github.event.pull_request.title }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.PUBLIC_PR_DISCORD_WEBHOOK }}
